## 2. How to Assemble Prompts in Your Runner

1. **Master Orchestrator Calls:**
   - \`system_instruction\`: Load \`00-control/01-master-orchestrator.md\`.
   - \`user_payload\`: Pass \`{ mode, project_state, input_markdown_or_logs }\`.

2. **Worker Agent Calls (Agents 03–13):**
   - \`system_instruction\`: Concatenate \`00-control/02-shared-base-contract.md\` + \`\\n\\n---\\n\\n\` + the active agent's \`.md\` file.
   - \`user_payload\`: Pass ONLY \`project_state.tech_stack\`, the current \`task\` ticket, and the exact files listed in \`task.target_files\` (plus error logs if invoking \`09-debugger\`). Never send the entire repo or full chat history.
   - Enforce Structured Outputs matching the worker JSON envelope in \`02-shared-base-contract.md\`.

---

## 3. End-to-End Phased Execution Loop

1. **Intake (\`INTAKE\` mode):**
   Feed your project spec \`.md\` file(s) to \`01-master-orchestrator\`. It locks \`tech_stack\`, generates phased task queues + checklists, and saves \`project_state.json\`.
2. **Task Execution (Sequential):**
   Pick the next \`PENDING\` task in the active phase and call its assigned worker agent. Write returned \`files\` to disk.
3. **Deterministic Local Gate (Zero API Calls):**
   Before invoking the Reviewer, your runner executes local build/lint checks (e.g., \`npm run build\`, \`tsc --noEmit\`).
   - If \`exit_code !== 0\`, send \`stderr\` straight to \`09-debugger\`.
4. **Code Audit:**
   Once the build passes, send the diff + task spec to \`07-code-reviewer\`.
   - \`COMPLETED\`: Mark task \`DONE\` and proceed to the next task.
   - \`NEEDS_REVISION\`: Route \`blockers\` back to the coder or \`09-debugger\`.
5. **Phase-End Automated Testing:**
   When all coding tasks in the phase are \`DONE\`, invoke \`08-qa-tester\` in \`WRITE_TESTS\` mode. Your runner executes the real test commands, then sends the actual \`stdout\`/\`stderr\` and \`exit_code\` back to \`08-qa-tester\` (\`ANALYZE_RESULTS\` mode).
6. **Phase Gate (\`PHASE_GATE\` mode):**
   Pass Reviewer sign-offs + real test results to \`01-master-orchestrator\`.
   - If all checklist items pass -> \`ADVANCE_PHASE\`, update \`project_state.json\`, and start the next phase.
   - If items fail -> \`REQUEUE_TASK\` for repair.
7. **Repeat** until all phases pass and \`13-deployment-engineer\` ships the release configs (\`PROJECT_COMPLETE\`).

## 4. 4-API-Key Pooling & Autonomous Timeout Fallback Plan

Because Gemini API rate limits (RPM, TPM, RPD) are enforced **per Google Cloud project**, each of your 4 API keys must belong to a **separate Google Cloud project**.

### Round-Robin Dispatch
- Maintain a central pool of 4 keys in your runner (\`key_1\` -> \`key_2\` -> \`key_3\` -> \`key_4\` -> \`key_1\`).
- Every agent call takes the next \`READY\` key regardless of which of the 13 agents is running.
- On \`429 RESOURCE_EXHAUSTED\`, place that key into \`COOLDOWN\` for 60 seconds and immediately rotate to the next \`READY\` key.

### 4-Tier Timeout & Autonomous Split Ladder
1. **Attempt 1 (Key Failover):** Enforce a 55-second HTTP timeout. On timeout or \`429\`/\`503\`, cool down the key and retry on the next healthy key with exponential backoff + jitter.
2. **Attempt 2 (Context Pruning):** If a second healthy key also times out, strip non-essential context (older handoff notes), pass \`budget_hint: { compact_mode: true }\`, and retry with only the target file + task spec.
3. **Attempt 3 (Autonomous Task Split via Orchestrator):** If a worker returns \`TASK_TOO_LARGE\`, Gemini returns \`finishReason === "MAX_TOKENS"\`, or a retry still times out, invoke \`01-master-orchestrator\` in \`RECOVER\` mode to split the task into 2–3 smaller subtasks (\`SPLIT_TASK\`, incrementing \`split_depth\`). Each subtask automatically runs on the next API key in the round-robin pool.
4. **Circuit Breaker (Hard Pause):** If any task hits \`retry_count >= 3\` or \`split_depth >= 2\` and still fails, persist \`project_state.json\` to disk and pause the loop for human inspection so you never burn API quota in an infinite loop.`

    const directoryTreeEl = document.getElementById('directoryTree');
    const searchInputEl = document.getElementById('searchInput');
    const fileBreadcrumbEl = document.getElementById('fileBreadcrumb');
    const fileTitleEl = document.getElementById('fileTitle');
    const thinkingBadgeEl = document.getElementById('thinkingBadge');
    const skillBadgeEl = document.getElementById('skillBadge');
    const fileDescriptionEl = document.getElementById('fileDescription');
    const charTokenStatsEl = document.getElementById('charTokenStats');
    const editorFilenameEl = document.getElementById('editorFilename');
    const editorLinesEl = document.getElementById('editorLines');
    const promptContentEl = document.getElementById('promptContent');
    const copyFileBtn = document.getElementById('copyFileBtn');
    const downloadFileBtn = document.getElementById('downloadFileBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const sidebarEl = document.getElementById('sidebar');
    const sidebarBackdropEl = document.getElementById('sidebarBackdrop');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const toastEl = document.getElementById('toast');
    const toastMessageEl = document.getElementById('toastMessage');

    /**
     * Show non-blocking toast notification
     */
    function showToast(message) {
      toastMessageEl.textContent = message;
      toastEl.classList.remove('opacity-0', 'translate-y-2');
      toastEl.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('opacity-100', 'translate-y-0');
        toastEl.classList.add('opacity-0', 'translate-y-2');
      }, 2200);
    }

    /**
     * Safe clipboard copy using execCommand('copy') for iframe compatibility
     */
    function copyTextToClipboard(text) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.top = '-9999px';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        const copied = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (copied) {
          showToast('Prompt copied to clipboard');
        } else {
          showToast('Copy failed — select text manually');
        }
      } catch (err) {
        console.error('Clipboard copy error:', err);
        showToast('Copy failed — select text manually');
      }
    }

    /**
     * Trigger browser download of a single text file
     */
    function downloadSingleFile(file) {
      try {
        const mime = file.filename.endsWith('.json') ? 'application/json;charset=utf-8' : 'text/markdown;charset=utf-8';
        const blob = new Blob([file.content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`Downloaded ${file.filename}`);
      } catch (err) {
        console.error('Download error:', err);
        showToast('Download failed');
      }
    }

    /**
     * Bundle all directory files into a ZIP archive preserving folder structure
     */
    async function downloadAllAsZip() {
      try {
        if (typeof JSZip === 'undefined') {
          const bundle = AGENCY_FILES.map(f => ({
            path: f.folder === 'root' ? f.filename : `${f.folder}/${f.filename}`,
            thinking_level: f.thinkingLevel,
            skill: f.skill,
            content: f.content
          }));
          const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'pwa-agency-prompts-bundle.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Downloaded combined JSON bundle');
          return;
        }

        const zip = new JSZip();
        const root = zip.folder('pwa-agency-prompts');

        AGENCY_FILES.forEach(file => {
          if (file.folder === 'root') {
            root.file(file.filename, file.content);
          } else {
            root.folder(file.folder).file(file.filename, file.content);
          }
        });

        const content = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'pwa-agency-prompts.zip';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Downloaded pwa-agency-prompts.zip');
      } catch (err) {
        console.error('ZIP generation failed:', err);
        showToast('Failed to generate ZIP');
      }
    }

    /**
     * Style badge based on recommended thinking_level
     */
    function getThinkingBadgeStyle(level) {
      if (level === 'high') {
        return {
          text: 'thinking: high',
          classes: 'bg-amber-500/15 text-amber-300 border-amber-500/30'
        };
      }
      if (level === 'medium') {
        return {
          text: 'thinking: medium',
          classes: 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30'
        };
      }
      return {
        text: 'thinking: low',
        classes: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30'
      };
    }

    /**
     * Render the folder/file tree in the left sidebar
     */
    function renderDirectoryTree() {
      directoryTreeEl.innerHTML = '';
      const query = searchQuery.trim().toLowerCase();

      const grouped = {};
      Object.keys(FOLDER_META).forEach(k => grouped[k] = []);

      AGENCY_FILES.forEach(file => {
        const matches = !query ||
          file.title.toLowerCase().includes(query) ||
          file.filename.toLowerCase().includes(query) ||
          file.skill.toLowerCase().includes(query) ||
          file.folder.toLowerCase().includes(query) ||
          file.description.toLowerCase().includes(query);
        if (matches) {
          grouped[file.folder].push(file);
        }
      });

      let visibleCount = 0;

      Object.keys(FOLDER_META).forEach(folderKey => {
        const files = grouped[folderKey];
        if (files.length === 0) return;
        visibleCount += files.length;

        const isCollapsed = !!collapsedFolders[folderKey] && !query;
        const folderWrapper = document.createElement('div');
        folderWrapper.className = 'mb-1.5';

        const folderBtn = document.createElement('button');
        folderBtn.type = 'button';
        folderBtn.className = 'w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-800/70 transition';
        folderBtn.innerHTML = `
          <span class="flex items-center gap-2 truncate">
            <svg class="w-3.5 h-3.5 text-slate-400 transition-transform ${isCollapsed ? '-rotate-90' : ''}" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
            <svg class="w-4 h-4 text-indigo-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>
            </svg>
            <span class="font-mono truncate">${FOLDER_META[folderKey].label}/</span>
          </span>
          <span class="text-[10px] font-normal text-slate-500 shrink-0 ml-2">${files.length}</span>
        `;
        folderBtn.addEventListener('click', () => {
          collapsedFolders[folderKey] = !collapsedFolders[folderKey];
          renderDirectoryTree();
        });

        folderWrapper.appendChild(folderBtn);

        if (!isCollapsed) {
          const listEl = document.createElement('div');
          listEl.className = 'mt-0.5 pl-4 space-y-0.5';

          files.forEach(file => {
            const isActive = file.id === activeFileId;
            const isJson = file.filename.endsWith('.json');
            const itemBtn = document.createElement('button');
            itemBtn.type = 'button';
            itemBtn.className = `w-full flex items-center justify-between gap-2 px-2.5 py-2 rounded-lg text-left text-xs transition ${
              isActive
                ? 'bg-indigo-600/20 text-indigo-200 border border-indigo-500/40 font-medium'
                : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 border border-transparent'
            }`;

            itemBtn.innerHTML = `
              <span class="flex items-center gap-2 min-w-0">
                <span class="font-mono text-[10px] px-1.5 py-0.5 rounded ${isJson ? 'bg-amber-500/15 text-amber-300' : 'bg-slate-800 text-cyan-300'} shrink-0">
                  ${isJson ? 'JSON' : 'MD'}
                </span>
                <span class="truncate font-mono">${file.filename}</span>
              </span>
            `;

            itemBtn.addEventListener('click', () => {
              activeFileId = file.id;
              renderDirectoryTree();
              renderActiveFile();
              closeMobileSidebar();
            });

            listEl.appendChild(itemBtn);
          });

          folderWrapper.appendChild(listEl);
        }

        directoryTreeEl.appendChild(folderWrapper);
      });

      if (visibleCount === 0) {
        directoryTreeEl.innerHTML = `<div class="p-4 text-center text-xs text-slate-500">No matching prompt files found.</div>`;
      }
    }

    /**
     * Render the currently selected prompt file in the right-hand viewer
     */
    function renderActiveFile() {
      const file = AGENCY_FILES.find(f => f.id === activeFileId) || AGENCY_FILES[0];
      if (!file) return;

      const isRoot = file.folder === 'root';
      fileBreadcrumbEl.innerHTML = isRoot
        ? `
          <span class="text-slate-500">pwa-agency-prompts</span>
          <span class="text-slate-600">/</span>
          <span class="text-slate-200">${file.filename}</span>
        `
        : `
          <span class="text-slate-500">pwa-agency-prompts</span>
          <span class="text-slate-600">/</span>
          <span class="text-indigo-400">${file.folder}</span>
          <span class="text-slate-600">/</span>
          <span class="text-slate-200">${file.filename}</span>
        `;

      fileTitleEl.textContent = file.title;
      const badgeStyle = getThinkingBadgeStyle(file.thinkingLevel);
      thinkingBadgeEl.textContent = badgeStyle.text;
      thinkingBadgeEl.className = `px-2 py-0.5 rounded-full text-[11px] font-medium border ${badgeStyle.classes}`;
      skillBadgeEl.textContent = file.skill;

      fileDescriptionEl.textContent = file.description;
      editorFilenameEl.textContent = isRoot ? file.filename : `${file.folder}/${file.filename}`;
      const lines = file.content.split('\n').length;
      const chars = file.content.length;
      const approxTokens = Math.ceil(chars / 4);
      editorLinesEl.textContent = `${lines} lines`;
      charTokenStatsEl.textContent = `~${approxTokens} tokens`;

      promptContentEl.textContent = file.content;
    }

    // Mobile Sidebar Controls
    function openMobileSidebar() {
      sidebarEl.classList.remove('-translate-x-full');
      sidebarBackdropEl.classList.remove('hidden');
    }

    function closeMobileSidebar() {
      sidebarEl.classList.add('-translate-x-full');
      sidebarBackdropEl.classList.add('hidden');
    }

    mobileMenuBtn.addEventListener('click', () => {
      if (sidebarEl.classList.contains('-translate-x-full')) {
        openMobileSidebar();
      } else {
        closeMobileSidebar();
      }
    });

    sidebarBackdropEl.addEventListener('click', closeMobileSidebar);

    // Search Filter Listener
    searchInputEl.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderDirectoryTree();
    });

    // Action Button Listeners
    copyFileBtn.addEventListener('click', () => {
      const file = AGENCY_FILES.find(f => f.id === activeFileId);
      if (file) copyTextToClipboard(file.content);
    });

    downloadFileBtn.addEventListener('click', () => {
      const file = AGENCY_FILES.find(f => f.id === activeFileId);
      if (file) downloadSingleFile(file);
    });

    downloadAllBtn.addEventListener('click', downloadAllAsZip);

    // Initialize App safely
    try {
      renderDirectoryTree();
      renderActiveFile();
    } catch (err) {
      console.error('Initialization error:', err);
      promptContentEl.textContent = 'Error loading prompt directory: ' + err.message;
    }
  </script>
</body>
</html>
